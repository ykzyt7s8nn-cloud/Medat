# Baut die App und veröffentlicht sie auf GitHub Pages.
#
# Voraussetzung: Repository -> Settings -> Pages -> Source = "GitHub Actions".
# Achtung: Für private Repositories ist GitHub Pages kostenpflichtig (Pro/Team).
# Bei einem privaten Repo stattdessen Vercel oder Netlify nutzen (siehe README).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/medat-kff-practice-app-7v5c2f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run selftest
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
